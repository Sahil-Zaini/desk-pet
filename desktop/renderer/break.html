<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
<title>Break time</title>
<style>
  :root { --ink: #f4f1ea; --mute: #b9bccb; --accent: #ffb44d; --bg: rgba(12, 14, 24, .86); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; user-select: none; animation: fade .6s ease both; }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  .panel { position: absolute; left: 50%; top: 64%; transform: translateX(-50%); display: grid; justify-items: center; gap: 12px; text-align: center; width: min(90vw, 620px); }
  h1 { margin: 0; font: 700 34px/1.1 "Courier New", monospace; letter-spacing: -.5px; }
  .time { font: 700 72px/1 "Courier New", monospace; font-variant-numeric: tabular-nums; color: var(--accent); }
  .tip { color: var(--mute); font-size: 19px; min-height: 1.5em; }
  .note { color: var(--mute); font-size: 13px; }
  .row { display: flex; gap: 10px; margin-top: 6px; }
  button { font: 600 15px "Segoe UI", system-ui, sans-serif; color: var(--ink); background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.25); border-radius: 10px; padding: 10px 18px; cursor: pointer; }
  button:hover { background: rgba(255,255,255,.16); }
  .bar { width: min(80vw, 420px); height: 6px; border-radius: 9px; background: rgba(255,255,255,.12); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 0; }
</style>
</head>
<body>
<div class="panel">
  <h1 id="title">Break time ☕</h1>
  <div class="time" id="time">5:00</div>
  <div class="bar"><i id="bar"></i></div>
  <div class="tip" id="tip"></div>
  <div class="row" id="buttons"></div>
  <div class="note" id="note"></div>
</div>
<script src="pet.js" data-auto="false"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var kind = q.get("kind"), strict = q.get("strict") === "1", ends = +q.get("ends"), isMain = q.get("main") === "1";
  var total = Math.max(1, ends - Date.now());
  var TIPS = ["Stand up and stretch 🙆", "Look out of a window 🌤️", "Drink a glass of water 💧", "Roll your shoulders back", "Close your eyes for a moment 😌", "Take a few deep breaths 🌬️", "Walk around a little 🚶"];
  var $ = function (id) { return document.getElementById(id); };

  $("title").textContent = kind === "focus-rest" ? "Focus done! Pomodoro break 🍅" : "Break time ☕";
  if (strict) $("note").textContent = "Strict mode is on: the screen unlocks when the timer ends.";
  else {
    var snooze = document.createElement("button"); snooze.textContent = "Snooze"; snooze.onclick = function () { deskpet.breakSnooze(); };
    var skip = document.createElement("button"); skip.textContent = "Skip this break"; skip.onclick = function () { deskpet.breakSkip(); };
    if (kind !== "focus-rest") $("buttons").appendChild(snooze);
    $("buttons").appendChild(skip);
  }

  var pet = null;
  if (isMain) {
    var size = innerWidth > 1600 ? 8 : 6;
    pet = DeskPet.spawn({
      pet: q.get("pet"), color: q.get("color"), name: q.get("name"), outfit: q.get("outfit"), size: size, credit: false, greet: false, stay: true,
      x: innerWidth / 2 - 16 * size, platforms: function () { return []; }, floor: function () { return Math.round(innerHeight * .58); }
    });
    setTimeout(function () { pet.say(kind === "focus-rest" ? "great focus! rest now 🍅" : "come sit with me 😺", 3500); }, 700);
  }

  var tipI = Math.floor(Math.random() * TIPS.length);
  function showTip() { $("tip").textContent = TIPS[tipI++ % TIPS.length]; }
  showTip(); setInterval(showTip, 12000);

  var finished = false;
  function tick() {
    var left = Math.max(0, ends - Date.now());
    var m = Math.floor(left / 60000), s = Math.floor(left / 1000) % 60;
    $("time").textContent = m + ":" + String(s).padStart(2, "0");
    $("bar").style.width = (100 - left / total * 100).toFixed(1) + "%";
    if (left <= 0 && !finished) {
      finished = true;
      $("title").textContent = "Done! ✨"; $("tip").textContent = "Welcome back.";
      if (pet) pet.celebrate();
      if (isMain) setTimeout(function () { deskpet.breakDone(); }, 1600);
      return;
    }
    if (!finished) setTimeout(tick, 250);
  }
  tick();
})();
</script>
</body>
</html>
